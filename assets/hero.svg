<svg width="900" height="330" viewBox="0 0 900 330"
     xmlns="http://www.w3.org/2000/svg">

  <rect width="900" height="330" rx="14" fill="#0d1117"/>

  <!-- Terminal header -->
  <rect width="900" height="42" rx="14" fill="#161b22"/>
  <rect y="28" width="900" height="14" fill="#161b22"/>

  <circle cx="22" cy="21" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="21" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="21" r="6" fill="#27c93f"/>

  <text x="90" y="26"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    atif@github: ~/projects
  </text>

  <!-- Command -->
  <text x="30" y="75"
        font-family="monospace"
        font-size="15"
        fill="#d01117">
    $
  </text>

  <text x="48" y="75"
        font-family="monospace"
        font-size="15"
        fill="#f0f6fc">
    python build_system.py
  </text>

  <!-- Typing cursor -->
  <rect x="255" y="61" width="8" height="18" fill="#d01117">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1s"
      repeatCount="indefinite"/>
  </rect>

  <!-- Data -->
  <g transform="translate(45 115)">

    <rect width="160" height="70" rx="8"
          fill="#161b22"
          stroke="#30363d"/>

    <text x="20" y="28"
          font-family="monospace"
          font-size="13"
          fill="#8b949e">
      DATA
    </text>

    <text x="20" y="52"
          font-family="monospace"
          font-size="16"
          fill="#f0f6fc">
      100K+ records
    </text>

  </g>

  <!-- Arrow 1 -->
  <path d="M205 150 L255 150"
        stroke="#d01117"
        stroke-width="2"
        stroke-dasharray="7 7">
    <animate
      attributeName="stroke-dashoffset"
      from="14"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>

  <!-- Feature engineering -->
  <g transform="translate(255 115)">

    <rect width="190" height="70" rx="8"
          fill="#161b22"
          stroke="#30363d"/>

    <text x="20" y="28"
          font-family="monospace"
          font-size="13"
          fill="#8b949e">
      FEATURES
    </text>

    <text x="20" y="52"
          font-family="monospace"
          font-size="15"
          fill="#f0f6fc">
      feature engineering
    </text>

  </g>

  <!-- Arrow 2 -->
  <path d="M445 150 L495 150"
        stroke="#d01117"
        stroke-width="2"
        stroke-dasharray="7 7">
    <animate
      attributeName="stroke-dashoffset"
      from="14"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>

  <!-- Model -->
  <g transform="translate(495 115)">

    <rect width="160" height="70" rx="8"
          fill="#161b22"
          stroke="#30363d"/>

    <text x="20" y="28"
          font-family="monospace"
          font-size="13"
          fill="#8b949e">
      MODEL
    </text>

    <text x="20" y="52"
          font-family="monospace"
          font-size="16"
          fill="#f0f6fc">
      XGBoost / LLM
    </text>

  </g>

  <!-- Arrow 3 -->
  <path d="M655 150 L705 150"
        stroke="#d01117"
        stroke-width="2"
        stroke-dasharray="7 7">
    <animate
      attributeName="stroke-dashoffset"
      from="14"
      to="0"
      dur="0.8s"
      repeatCount="indefinite"/>
  </path>

  <!-- API -->
  <g transform="translate(705 115)">

    <rect width="150" height="70" rx="8"
          fill="#161b22"
          stroke="#30363d"/>

    <text x="20" y="28"
          font-family="monospace"
          font-size="13"
          fill="#8b949e">
      DEPLOY
    </text>

    <text x="20" y="52"
          font-family="monospace"
          font-size="16"
          fill="#f0f6fc">
      FastAPI
    </text>

  </g>

  <!-- Status -->
  <text x="30" y="225"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    system status
  </text>

  <text x="150" y="225"
        font-family="monospace"
        font-size="13"
        fill="#27c93f">
    ● ONLINE
  </text>

  <text x="270" y="225"
        font-family="monospace"
        font-size="13"
        fill="#8b949e">
    model
  </text>

  <text x="325" y="225"
        font-family="monospace"
        font-size="13"
        fill="#f0f6fc">
    production-ready
  </text>

  <!-- Metrics -->
  <g transform="translate(30 250)">

    <rect width="250" height="48" rx="7"
          fill="#161b22"/>

    <text x="15" y="20"
          font-family="monospace"
          font-size="11"
          fill="#8b949e">
      FORECAST IMPROVEMENT
    </text>

    <text x="15" y="39"
          font-family="monospace"
          font-size="15"
          fill="#d01117">
      +20–35%
    </text>

  </g>

  <g transform="translate(295 250)">

    <rect width="250" height="48" rx="7"
          fill="#161b22"/>

    <text x="15" y="20"
          font-family="monospace"
          font-size="11"
          fill="#8b949e">
      CLASSIFICATION
    </text>

    <text x="15" y="39"
          font-family="monospace"
          font-size="15"
          fill="#d01117">
      95% accuracy
    </text>

  </g>

  <g transform="translate(560 250)">

    <rect width="295" height="48" rx="7"
          fill="#161b22"/>

    <text x="15" y="20"
          font-family="monospace"
          font-size="11"
          fill="#8b949e">
      SYSTEM
    </text>

    <text x="15" y="39"
          font-family="monospace"
          font-size="15"
          fill="#d01117">
      ML + APIs + LLMs
    </text>

  </g>

</svg>
